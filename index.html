<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b0b10" />
<title>Play</title>
<style>
  :root {
    --bg1: #141423;
    --bg2: #0b0b10;
    --accent: #7c5cff;
    --accent2: #e86bff;
    --text: #f4f4fb;
    --muted: #9a9ab0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(130% 120% at 50% 0%, var(--bg1) 0%, var(--bg2) 60%, #050507 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    text-align: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 40px; width: 100%; max-width: 440px; }

  /* The one button */
  .go {
    position: relative;
    width: min(62vw, 260px);
    height: min(62vw, 260px);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    color: #fff;
    background:
      radial-gradient(120% 120% at 30% 25%, var(--accent2) 0%, var(--accent) 55%, #4a32c8 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08) inset,
      0 20px 60px rgba(124,92,255,0.45),
      0 0 120px rgba(232,107,255,0.25);
    display: grid;
    place-items: center;
    transition: transform .15s ease, box-shadow .25s ease;
    touch-action: manipulation;
  }
  .go:active { transform: scale(0.96); }
  .go svg { width: 40%; height: 40%; display: block; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35)); }
  .go .pause-icon { display: none; }
  body.playing .go .play-icon { display: none; }
  body.playing .go .pause-icon { display: block; }

  /* Pulsing ring while playing */
  .go::after {
    content: "";
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 2px solid rgba(232,107,255,0.5);
    opacity: 0;
  }
  body.playing .go::after { animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse {
    0%   { opacity: .6; transform: scale(1); }
    100% { opacity: 0;  transform: scale(1.18); }
  }

  .label { font-size: 15px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  .now {
    min-height: 48px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    opacity: 0;
    transition: opacity .4s ease;
  }
  body.started .now { opacity: 1; }
  .now .title { font-size: 20px; font-weight: 600; line-height: 1.25; }
  .now .count { font-size: 13px; color: var(--muted); letter-spacing: .04em; }

  .bar {
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,0.1);
    overflow: hidden;
    opacity: 0;
    transition: opacity .4s ease;
  }
  body.started .bar { opacity: 1; }
  .bar > span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .25s linear; }

  .empty { color: var(--muted); font-size: 15px; line-height: 1.6; max-width: 320px; }
  .shuffle {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease, opacity .3s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .shuffle svg { width: 16px; height: 16px; }
  .shuffle[aria-pressed="true"] {
    color: #fff;
    border-color: transparent;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 24px rgba(124,92,255,0.35);
  }
  body.started .shuffle { opacity: 0; pointer-events: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="stage">
    <div class="label" id="label">Tap to play</div>

    <button class="go" id="go" aria-label="Play">
      <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>

    <div class="now" id="now">
      <div class="title" id="title"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="bar" id="barWrap"><span id="bar"></span></div>

    <button class="shuffle" id="shuffle" aria-pressed="false" aria-label="Shuffle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      <span>Shuffle</span>
    </button>

    <p class="empty hidden" id="empty">No tracks loaded yet.</p>
  </div>

  <audio id="audio" preload="auto" playsinline></audio>

  <script src="playlist.js"></script>
  <script>
  (function () {
    var TRACKS = (window.TRACKS || []);
    var audio = document.getElementById('audio');
    var go = document.getElementById('go');
    var label = document.getElementById('label');
    var titleEl = document.getElementById('title');
    var countEl = document.getElementById('count');
    var bar = document.getElementById('bar');
    var empty = document.getElementById('empty');

    var shuffleBtn = document.getElementById('shuffle');

    var order = [];        // play order: indices into TRACKS
    var pos = 0;           // current position within order
    var started = false;
    var shuffleOn = false;

    if (!TRACKS.length) {
      go.classList.add('hidden');
      label.classList.add('hidden');
      shuffleBtn.classList.add('hidden');
      empty.classList.remove('hidden');
      return;
    }

    function prettyName(t) {
      if (t.title) return t.title;
      var n = decodeURIComponent((t.src || '').split('/').pop() || '');
      return n.replace(/\.[a-z0-9]+$/i, '').replace(/^\d+[\s._-]+/, '').replace(/[_]+/g, ' ').trim();
    }

    function buildOrder() {
      order = TRACKS.map(function (_, i) { return i; });
      if (shuffleOn) {
        for (var i = order.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
        }
      }
    }

    function load(p) {
      pos = p;
      var t = TRACKS[order[p]];
      audio.src = t.src;
      titleEl.textContent = prettyName(t);
      countEl.textContent = 'Track ' + (p + 1) + ' of ' + TRACKS.length;
      bar.style.width = '0%';
      if ('mediaSession' in navigator && window.MediaMetadata) {
        try { navigator.mediaSession.metadata = new MediaMetadata({ title: prettyName(t) }); } catch (e) {}
      }
    }

    function play() {
      audio.play().then(function () {
        document.body.classList.add('playing', 'started');
        started = true;
        label.textContent = shuffleOn ? 'Playing · shuffled' : 'Playing';
      }).catch(function () {
        document.body.classList.remove('playing');
      });
    }

    function pause() {
      audio.pause();
      document.body.classList.remove('playing');
      label.textContent = 'Paused';
    }

    shuffleBtn.addEventListener('click', function () {
      shuffleOn = !shuffleOn;
      shuffleBtn.setAttribute('aria-pressed', shuffleOn ? 'true' : 'false');
    });

    go.addEventListener('click', function () {
      if (!started) { buildOrder(); load(0); play(); return; }
      if (audio.paused) { play(); } else { pause(); }
    });

    audio.addEventListener('timeupdate', function () {
      if (audio.duration) bar.style.width = (audio.currentTime / audio.duration * 100) + '%';
    });

    audio.addEventListener('ended', function () {
      if (pos < order.length - 1) {
        load(pos + 1);
        play();
      } else {
        document.body.classList.remove('playing', 'started');
        label.textContent = 'Done';
        bar.style.width = '100%';
        started = false;
      }
    });

    // Lock screen / headphone controls
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', play);
      navigator.mediaSession.setActionHandler('pause', pause);
      navigator.mediaSession.setActionHandler('nexttrack', function () {
        if (pos < order.length - 1) { load(pos + 1); play(); }
      });
      navigator.mediaSession.setActionHandler('previoustrack', function () {
        if (pos > 0) { load(pos - 1); play(); }
      });
    }
  })();
  </script>
</body>
</html>
